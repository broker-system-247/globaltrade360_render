<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrade360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0e17; color: white; }
        .gold-text { color: #FFD700; }
        .card { background: #1a1f2e; border: 1px solid #FFD700; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand gold-text" href="#">GlobalTrade360</a>
            <button class="btn btn-warning" onclick="showSection('login')">Login</button>
        </div>
    </nav>
    
    <div class="container mt-5">
        <!-- Home -->
        <div id="home" class="section">
            <h1 class="gold-text">Crypto & Forex Trading Platform</h1>
            <button class="btn btn-warning btn-lg" onclick="showSection('register')">Get Started</button>
        </div>
        
        <!-- Login -->
        <div id="login" class="section" style="display:none;">
            <div class="card p-4">
                <h3 class="gold-text">Login</h3>
                <input type="text" id="loginUser" class="form-control mb-3" placeholder="Username">
                <input type="password" id="loginPass" class="form-control mb-3" placeholder="Password">
                <button class="btn btn-warning w-100" onclick="login()">Login</button>
                <p class="mt-3">Test: testuser / Test123!</p>
            </div>
        </div>
        
        <!-- Register -->
        <div id="register" class="section" style="display:none;">
            <div class="card p-4">
                <h3 class="gold-text">Register</h3>
                <input type="text" id="regName" class="form-control mb-3" placeholder="Full Name">
                <input type="email" id="regEmail" class="form-control mb-3" placeholder="Email">
                <input type="text" id="regUser" class="form-control mb-3" placeholder="Username">
                <input type="password" id="regPass" class="form-control mb-3" placeholder="Password">
                <button class="btn btn-warning w-100" onclick="register()">Register</button>
            </div>
        </div>
        
        <!-- Dashboard -->
        <div id="dashboard" class="section" style="display:none;">
            <h3>Welcome, <span id="userName"></span></h3>
            <p>Balance: $<span id="userBalance">0</span></p>
        </div>
    </div>
    
    <script>
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(section).style.display = 'block';
        }
        
        async function login() {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('loginUser').value,
                    password: document.getElementById('loginPass').value
                })
            });
            const data = await response.json();
            if(data.success) {
                alert('Login successful!');
                showSection('dashboard');
                document.getElementById('userName').textContent = data.user.name || data.user.username;
                document.getElementById('userBalance').textContent = data.user.balance || 0;
            } else {
                alert(data.error || 'Login failed');
            }
        }
        
        async function register() {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('regName').value,
                    email: document.getElementById('regEmail').value,
                    username: document.getElementById('regUser').value,
                    password: document.getElementById('regPass').value
                })
            });
            const data = await response.json();
            if(data.success) {
                alert(data.message);
                showSection('login');
            } else {
                alert(data.error || 'Registration failed');
            }
        }
        
        // Show home by default
        showSection('home');
    </script>
</body>
</html>
